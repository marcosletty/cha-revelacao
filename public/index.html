<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revelação do Sexo do Bebê</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="configuration" class="screen">
            <h1>CONFIGURAÇÃO DA REVELAÇÃO</h1>
            <p>Escolha o resultado da revelação</p>
            <button id="boyButton" class="option-button">👦 MENINO</button>
            <button id="girlButton" class="option-button">👧 MENINA</button>
        </div>
        <div id="confirmation" class="screen hidden">
            <h1>Configuração completa.</h1>
            <button id="startRevealButton" class="action-button">INICIAR REVELAÇÃO</button>
        </div>
        <div id="stages" class="screen hidden">
            <div id="stageContent"></div>
            <button id="continueButton" class="action-button">CONTINUAR</button>
        </div>
        <div id="finalReveal" class="screen hidden">
            <h1 id="revealMessage"></h1>
            <button id="revealButton" class="action-button">CLIQUE PARA REVELAR</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
